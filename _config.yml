title: The STAR Experiment
description: The STAR experiment at RHIC, Brookhaven National Laboratory

# TODO: set url to the final public address before launch.
# Keep baseurl empty: the site then previews at http://127.0.0.1:4000/ locally.
# When served as a project page (user.github.io/repo), the GitHub Actions
# workflow in .github/workflows/jekyll.yml passes the base path to the build
# (`jekyll build --baseurl ...`), so nothing needs to change here.
# Every link in the templates goes through `relative_url`.

url: "https://buddhasystem.github.io"
baseurl: ""

timezone: America/New_York

# News items are posts: _posts/YYYY-MM-DD-title.md
permalink: /news/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-sitemap        # generates /sitemap.xml for search engines
  - jekyll-redirect-from  # keeps old www.star.bnl.gov URLs working (redirect_from:)

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
