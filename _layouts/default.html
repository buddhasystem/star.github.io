<!doctype html>
<html lang="en">
{% include head.html %}
<body>

  <header class="navbar navbar-dark sticky-top site-header flex-md-nowrap p-0 shadow">
    <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="{{ '/' | relative_url }}">
      {%- comment -%} TODO: replace with the STAR logo (assets/images/logo/) {%- endcomment -%}
      <span class="brand-mark">&#9733;</span>&nbsp;The STAR Experiment
    </a>
    <div class="navbar-nav px-4"><h1 class="page-title">{{ page.title }}</h1></div>
    <button class="navbar-toggler position-absolute d-md-none collapsed" type="button"
            data-bs-toggle="collapse" data-bs-target="#sidebarMenu"
            aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
  </header>

  <div class="container-fluid">
    <div class="row">
      {% include sidebar.html %}
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-3 pb-5">
        <div class="content">
          {{ content }}
        </div>
      </main>
    </div>
  </div>

  <script src="{{ '/assets/bootstrap/js/bootstrap.bundle.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/feather/feather.min.js' | relative_url }}"></script>
  <script>feather.replace()</script>
</body>
</html>
